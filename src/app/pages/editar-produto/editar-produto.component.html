<form [formGroup]="produtoForm" (ngSubmit)="salvarProduto()" class="form-container">
  <h2>Editar Produto</h2>
  <mat-form-field appearance="fill">
    <mat-label>Título</mat-label>
    <input matInput formControlName="title" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Descrição</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Preço</mat-label>
    <input matInput type="number" formControlName="price" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Estoque</mat-label>
    <input matInput type="number" formControlName="stock" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Imagem (URL)</mat-label>
    <input matInput formControlName="image" />
  </mat-form-field>


  <!-- Preview da imagem -->
  <div *ngIf="produtoForm.get('image')?.value">
    <h4>Preview da Imagem:</h4>
    <img [src]="produtoForm.get('image')?.value" alt="Preview" width="200">
  </div>


  <button mat-raised-button color="primary" type="submit">Salvar Alterações</button>
</form>
